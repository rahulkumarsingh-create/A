<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A - Personal AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">
        <header>
            <h1>A</h1>
            <p>Personal AI Assistant</p>
        </header>

        <main id="chat">
            <div class="message ai">
                Hi, I'm A. What do we do now?
            </div>
        </main>

        <div class="input-area">
            <input
                id="messageInput"
                type="text"
                placeholder="Talk to A..."
                autocomplete="off"
            >

            <button id="sendButton">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
